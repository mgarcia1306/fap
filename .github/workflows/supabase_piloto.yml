name: FARO - Piloto Supabase (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-supabase-piloto
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxis Python
        run: python -m py_compile monitor_supabase.py
      - name: Verificar secrets requeridos
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          test -n "$CHILECOMPRA_TICKET" || { echo "::error::Falta CHILECOMPRA_TICKET"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "::error::Falta SUPABASE_SECRET_KEY"; exit 1; }
      - name: Sincronizar una ventana de Compra Agil
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://kqoxbbhazxlnqifzvfzh.supabase.co
          PYTHONUNBUFFERED: '1'
        run: python monitor_supabase.py
