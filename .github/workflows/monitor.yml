
name: FARO - API Compra Agil (prueba)

# Ejecutar automáticamente cada 15 minutos
# o manualmente desde GitHub Actions.
on:
  schedule:
    - cron: '*/15 * * * *'

  workflow_dispatch:

# Permitir guardar el historial en el repositorio
permissions:
  contents: write

# Evitar que dos ejecuciones modifiquen
# el historial simultáneamente.
concurrency:
  group: faro-api-monitor
  cancel-in-progress: false

jobs:
  sync:
    name: Sincronizar Compras Agiles
    runs-on: ubuntu-latest

    # Tiempo máximo permitido para la ejecución
    timeout-minutes: 15

    steps:

      # 1. Descargar los archivos del repositorio
      - name: Descargar repositorio
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Ejecutar la sincronización incremental
      - name: Consultar cambios
        env:
          CHILECOMPRA_TICKET: ${{ secrets.CHILECOMPRA_TICKET }}
          PYTHONUNBUFFERED: '1'
        run: |
          echo "Iniciando sincronización FARO..."
          python monitor.py

      # 4. Guardar los cambios del historial
      # También se ejecuta si Python falla,
      # siempre que el repositorio se haya descargado.
      - name: Guardar historial en repositorio
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          if ! git diff --quiet -- state.json; then

            echo "Guardando progreso de sincronización..."

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state.json
            git commit -m "FARO: actualizar historial incremental"
            git push

            echo "Historial actualizado correctamente."

          else

            echo "Sin cambios en el historial."

          fi
