# Variante de la rama experimental. En main no se modifica el diagnostico.
name: FARO - Diagnostico API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    if: github.ref_name == 'experimento/faro-100-muestra-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar rama experimental
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar requests
        run: python -m pip install 'requests>=2.31,<3'
      - name: Pruebas sin red
        working-directory: experimentos/faro100/2026-11-22
        run: python -m unittest -v test_adjuntos_faro100.py
      - name: Descargar adjuntos de 3904-1092-COT26
        working-directory: experimentos/faro100/2026-11-22
        env:
          PYTHONUNBUFFERED: '1'
        run: python descargar_adjuntos_faro100.py
      - name: Guardar PDFs como artefacto por 7 dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro100-adjuntos-3904-1092-${{ github.run_id }}
          path: experimentos/faro100/2026-11-22/salida_adjuntos/
          if-no-files-found: warn
          retention-days: 7
