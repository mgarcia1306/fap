name: Test corregir API Compra Agil
on:
  push:
    branches:
      - fix/fechas-api-compra-agil
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test de fechas y payload (sin API ni Supabase)
        run: |
          python -m py_compile monitor_supabase.py
          python -m unittest -v test_fechas_api.py
